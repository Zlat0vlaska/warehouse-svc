run:
  timeout: 3m

linters:
  disable-all: true
  enable:
    - errcheck      # забытые ошибки
    - govet         # то же что go vet
    - ineffassign   # ненужные присваивания
    - staticcheck   # большой набор проверок
    - unused        # неиспользуемый код
    - gofmt         # форматирование
    - revive        # стилистика (на замену golint)
    - gosec         # security
    - gocritic      # разные хорошие проверки

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec    

linters-settings:
  revive:
    rules:
      - name: unused-parameter
        disabled: true