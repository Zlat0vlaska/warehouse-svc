version: "2"

run:
  timeout: 3m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - gocritic
  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true

issues:
  max-same-issues: 0

formatters:
  enable:
    - gofmt